        image: アイコン画像

      song:
        title: 曲名
        artist: アーティスト名
        genre: ジャンル
        key: キー
        memo: メモ

      practice:
        title: 曲名
        artist: アーティスト名
        key: キー
        score: スコア
        comment: 練習メモ
        result_image1: 結果画像1
