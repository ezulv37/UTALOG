ja:
  activerecord:
    models:
      user: ユーザー
      song: 曲
      practice: 練習記録

    attributes:
      user:
        email: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認）
        image: アイコン画像

      song:
        title: 曲名
        artist: アーティスト名
        key: キー
        memo: メモ

      practice:
        title: 曲名
        artist: アーティスト名
        key: キー
        score: スコア
        comment: コメント
        result_image1: 結果画像1
        result_image2: 結果画像2

  errors:
    format: "%{attribute}%{message}"
    messages:
      not_saved: "%{resource}は保存されませんでした。"
      blank: "を入力してください"
      too_short: "は%{count}文字以上で入力してください"
      too_long: "は%{count}文字以内で入力してください"
      taken: "はすでに使用されています"
      invalid: "は不正な値です"
      not_a_number: "は数値で入力してください"
      greater_than_or_equal_to: "は%{count}以上の値にしてください"
      only_integer: "は整数で入力してください"
